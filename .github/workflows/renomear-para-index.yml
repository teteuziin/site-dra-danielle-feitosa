name: Renomear para index.html

on:
  workflow_dispatch:

jobs:
  renomear:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Renomear arquivo para index.html
        run: |
          git config user.name "teteuziin"
          git config user.email "teteuziin@users.noreply.github.com"
          git mv landing-page-dra-danielle-feitosa.html index.html
          git commit -m "Renomeia para index.html"
          git push
